  #   container_name: ${COMPOSE_PROJECT_NAME}_node
  #   env_file: .env
  #   networks: [devstack]
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   ports:
  #     - "${NODE_PORT}:3000"
  #   volumes:
  #     - ${SITES_PATH}:/var/www
  #     - ${LOGS_PATH}:/var/log/node
  #   restart: unless-stopped