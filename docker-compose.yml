########################################################################
# devstack — docker-compose.yml
#
# Starting point: the "linux" desktop machine only. mysql, nginx, node,
# and redis folders are provisioned and stubbed below (commented) so the
# stack can grow into a full multi-container dev environment without
# restructuring anything later.
########################################################################

networks:
  devstack:
    name: ${NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}

volumes:
  linux_config:
  linux_mozilla:
  linux_vscode:

services:

  # ------------------------------------------------------------------
  # linux — main desktop machine (XFCE, browser + VNC access, VS Code)
  # ------------------------------------------------------------------
  linux:
    build:
      context: ./linux
      args:
        DESKTOP_USER: ${DESKTOP_USER}
        DESKTOP_UID: ${DESKTOP_UID}
        DESKTOP_GID: ${DESKTOP_GID}
    container_name: ${LINUX_HOSTNAME}
    hostname: ${LINUX_HOSTNAME}
    env_file: .env
    networks:
      - devstack
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${LINUX_NOVNC_PORT}:6901"   # browser: http://localhost:${LINUX_NOVNC_PORT}/vnc.html
      - "${LINUX_VNC_PORT}:5901"     # native VNC client
      # PHP-FPM (port 9000) is intentionally NOT published here — it's
      # reached by other containers over the devstack network at
      # linux:9000 (see the nginx stub below). Add a "9000:9000" line
      # here only if you also want it reachable directly from the host.
    volumes:
      - ${SITES_PATH}:/var/www
      - ${SITES_JSON_PATH}:/sites.json:ro
      - ${LOGS_PATH}:/var/log/devstack
      - ${DATA_PATH}:/data
      - ./linux/php/php.ini:/etc/php/8.1/php.ini
      # Persist desktop/app settings across container recreation. Scoped
      # to these specific dirs (not all of /home/${DESKTOP_USER}) so that
      # ~/.vnc/xstartup and other image-managed files always come fresh
      # from the image on rebuild, instead of getting frozen at whatever
      # they were the first time the volume was populated.
      - linux_config:/home/${DESKTOP_USER}/.config    # XFCE settings, Chrome profile, VS Code settings
      - linux_mozilla:/home/${DESKTOP_USER}/.mozilla   # Firefox profile
      - linux_vscode:/home/${DESKTOP_USER}/.vscode     # VS Code installed extensions
      # Bind-mounted (not named volumes) so these are directly editable
      # from the host — see linux/persist/.
      - ./linux/persist/bashrc:/home/${DESKTOP_USER}/.bashrc
      - ./linux/persist/Desktop:/home/${DESKTOP_USER}/Desktop
    shm_size: "2gb"
    restart: unless-stopped
    # --------------------------------------------------------------
    # GPU acceleration (optional).
    # Requires: NVIDIA driver + NVIDIA Container Toolkit on the HOST,
    # and ENABLE_GPU=true in .env. Uncomment the block below to request
    # the GPU reservation. See README.md -> "GPU acceleration" for the
    # VirtualGL usage pattern (`vglrun <app>`) once this is enabled.
    # --------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all

  # ------------------------------------------------------------------
  # nginx — routes any number of sites (defined in ../sites.json) to
  # php-fpm on linux:9000, with an auto-provisioned self-signed cert
  # per site domain.
  # ------------------------------------------------------------------
  nginx:
    build: ./nginx
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    env_file: .env
    networks:
      - devstack
    depends_on:
      linux:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${SITES_PATH}:/var/www:ro
      - ${SITES_JSON_PATH}:/sites.json:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ${LOGS_PATH}:/var/log/nginx
    restart: unless-stopped

  # ------------------------------------------------------------------
  # mysql — persists to ./mysql, auto-imports any .sql/.sql.gz/.sh dumps
  # found in ./data on first-ever init (empty-volume behavior built into
  # the official image — see README.md for what that means in practice).
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - devstack
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_PATH}:/var/lib/mysql
      - ${DATA_PATH}:/docker-entrypoint-initdb.d
      - ${LOGS_PATH}:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Future services — folders are provisioned (./node). Uncomment and
  # flesh out as the stack grows.
  # ------------------------------------------------------------------

  # redis:
  #   image: redis:7-alpine
  #   container_name: ${COMPOSE_PROJECT_NAME}_redis
  #   env_file: .env
  #   networks: [devstack]
  #   ports:
  #     - "${REDIS_PORT}:6379"
  #   volumes:
  #     - ${DATA_PATH}/redis:/data
  #   restart: unless-stopped

