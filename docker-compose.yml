########################################################################
# devstack — docker-compose.yml
#
# Starting point: the "linux" desktop machine only. node,
# and redis folders are provisioned and stubbed below (commented) so the
# stack can grow into a full multi-container dev environment without
# restructuring anything later.
########################################################################
x-ollama-env: &ollama-env
  OLLAMA_HOST: 0.0.0.0:11434
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
  OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
  OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
  OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
  OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
  OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}

x-ollama-base: &ollama-base
  image: ollama/ollama:${OLLAMA_TAG:-latest}
  container_name: ${COMPOSE_PROJECT_NAME}_ollama
  environment: *ollama-env
  networks:
    devstack:
      aliases:
        - ollama
  ports:
    # Loopback only: the Ollama API has no authentication.
    - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
  volumes:
    - ollama_models:/root/.ollama
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  restart: unless-stopped


networks:
  devstack:
    name: ${NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}

volumes:
  linux_config:
  linux_mozilla:
  linux_vscode:
  mongo_data:
  mongo_config:
  ollama_models:
  open_webui_data:

services:

  # ------------------------------------------------------------------
  # linux — main desktop machine (XFCE, browser + VNC access, VS Code)
  # ------------------------------------------------------------------
  linux:
    build:
      context: ./linux
      args:
        DESKTOP_USER: ${DESKTOP_USER}
        DESKTOP_UID: ${DESKTOP_UID}
        DESKTOP_GID: ${DESKTOP_GID}
    container_name: ${LINUX_HOSTNAME}
    hostname: ${LINUX_HOSTNAME}
    env_file: .env
    networks:
      - devstack
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${LINUX_NOVNC_PORT}:6901"   # browser: http://localhost:${LINUX_NOVNC_PORT}/vnc.html
      - "${LINUX_VNC_PORT}:5901"     # native VNC client
      # PHP-FPM (port 9000) is intentionally NOT published here — it's
      # reached by other containers over the devstack network at
      # linux:9000 (see the nginx stub below). Add a "9000:9000" line
      # here only if you also want it reachable directly from the host.
    volumes:
      - ${SITES_PATH}:/var/www
      - ./linux/scripts:/var/scripts
      - ${SITES_JSON_PATH}:/sites.json:ro
      - ${LOGS_PATH}:/var/log/devstack
      - ${DATA_PATH}:/data
      - ./linux/php/php.ini:/etc/php/8.1/fpm/php.ini
      - ./linux/php/www.conf:/etc/php/8.1/fpm/pool.d/www.conf
      - ./linux/browser/bookmarks.json:/etc/devstack/bookmarks.json:ro
      # Persist desktop/app settings across container recreation. Scoped
      # to these specific dirs (not all of /home/${DESKTOP_USER}) so that
      # ~/.vnc/xstartup and other image-managed files always come fresh
      # from the image on rebuild, instead of getting frozen at whatever
      # they were the first time the volume was populated.
      - linux_config:/home/${DESKTOP_USER}/.config    # XFCE settings, Chrome profile, VS Code settings
      - linux_mozilla:/home/${DESKTOP_USER}/.mozilla   # Firefox profile
      - linux_vscode:/home/${DESKTOP_USER}/.vscode     # VS Code installed extensions
      # Bind-mounted (not named volumes) so these are directly editable
      # from the host — see linux/persist/.
      - ./linux/persist/bashrc:/home/${DESKTOP_USER}/.bashrc
      - ./linux/persist/Desktop:/home/${DESKTOP_USER}/Desktop
    shm_size: "4gb"
    restart: unless-stopped
    # --------------------------------------------------------------
    # GPU acceleration (optional).
    # Requires: NVIDIA driver + NVIDIA Container Toolkit on the HOST,
    # and ENABLE_GPU=true in .env. Uncomment the block below to request
    # the GPU reservation. See README.md -> "GPU acceleration" for the
    # VirtualGL usage pattern (`vglrun <app>`) once this is enabled.
    # --------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=all

  # ------------------------------------------------------------------
  # nginx — routes any number of sites (defined in ../sites.json) to
  # php-fpm on linux:9000, with an auto-provisioned self-signed cert
  # per site domain.
  # ------------------------------------------------------------------
  nginx:
    build: ./nginx
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    env_file: .env
    networks:
      - devstack
    depends_on:
      linux:
        condition: service_started
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${SITES_PATH}:/var/www:ro
      - ${SITES_JSON_PATH}:/sites.json:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ${LOGS_PATH}:/var/log/nginx
    restart: unless-stopped

  # ------------------------------------------------------------------
  # mysql — persists to ./mysql, auto-imports any .sql/.sql.gz/.sh dumps
  # found in ./data on first-ever init (empty-volume behavior built into
  # the official image — see README.md for what that means in practice).
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - devstack
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_PATH}:/var/lib/mysql
      - ${DATA_PATH}:/docker-entrypoint-initdb.d
      - ${LOGS_PATH}:/var/log/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Exactly one Ollama variant runs, chosen by COMPOSE_PROFILES in .env
  # (nvidia | amd | cpu). All share the alias "ollama". Host mode = no profile.
  ollama-nvidia:
    <<: *ollama-base
    profiles: ["nvidia"]
    environment:
      <<: *ollama-env
      CUDA_VISIBLE_DEVICES: ${LLM_GPU_IDS:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-amd:
    <<: *ollama-base
    image: ollama/ollama:${OLLAMA_ROCM_TAG:-rocm}
    profiles: ["amd"]
    environment:
      <<: *ollama-env
      HIP_VISIBLE_DEVICES: ${LLM_GPU_IDS:-0}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  ollama-cpu:
    <<: *ollama-base
    profiles: ["cpu"]

  # One-shot: waits for Ollama, pulls the models named in .env, exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_ollama_pull
    profiles: ["nvidia", "amd", "cpu"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODELS: ${LLM_CHAT_MODEL},${LLM_AUTOCOMPLETE_MODEL}
    networks:
      - devstack
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 3; done
        for m in $$(echo "$$LLM_MODELS" | tr ',' ' '); do
          echo "== pulling $$m"; ollama pull "$$m" || echo "WARNING: pull failed for $$m"
        done
        echo "== models ready"; ollama list
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: ${COMPOSE_PROJECT_NAME}_open_webui
    environment:
      OLLAMA_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      WEBUI_AUTH: ${OPEN_WEBUI_AUTH:-true}
    networks:
      - devstack
    extra_hosts:
      - "host.docker.internal:host-gateway"   # for host mode
    ports:
      - "${OPEN_WEBUI_PORT:-8083}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

  # ------------------------------------------------------------------
  # phpmyadmin — web UI for the mysql container. Official image, its own
  # container; connects over the devstack network. Log in at
  # http://localhost:${PHPMYADMIN_PORT} with the MYSQL_USER / MYSQL_PASSWORD
  # (or root / MYSQL_ROOT_PASSWORD) values from .env.
  # ------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: ${COMPOSE_PROJECT_NAME}_phpmyadmin
    env_file: .env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - devstack
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT}:80"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME}_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      # Read by mongo/init/10-create-app-user.js (first init only).
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - devstack
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      # Named volumes (not a bind mount): MongoDB's WiredTiger engine is
      # unreliable on Windows/Docker Desktop bind mounts. These still
      # persist across restarts and container recreation.
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # *.js / *.sh here run once, on first init of an empty mongo_data.
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" --authenticationDatabase "$$MONGO_DATABASE" "$$MONGO_DATABASE" --eval "db.runCommand({ping:1}).ok" | grep -q 1
      interval: 60s        # steady state: one connection a minute
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s   # fast checks while starting, so dependents aren't delayed
    restart: unless-stopped
 
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ${COMPOSE_PROJECT_NAME}_mongo_express
    environment:
      # Connects as root so every database is browsable; use the app
      # user's URI instead to limit it to one database.
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - devstack
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    restart: unless-stopped


  # ------------------------------------------------------------------
  # Future services — folders are provisioned (./node). Uncomment and
  # flesh out as the stack grows.
  # ------------------------------------------------------------------

  # redis:
  #   image: redis:7-alpine
  #   container_name: ${COMPOSE_PROJECT_NAME}_redis
  #   env_file: .env
  #   networks: [devstack]
  #   ports:
  #     - "${REDIS_PORT}:6379"
  #   volumes:
  #     - ${DATA_PATH}/redis:/data
  #   restart: unless-stopped

  # node:
  #   build: ./node
  #   container_name: ${COMPOSE_PROJECT_NAME}_node
  #   env_file: .env
  #   networks: [devstack]
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   ports:
  #     - "${NODE_PORT}:3000"
  #   volumes:
  #     - ${SITES_PATH}:/var/www
  #     - ${LOGS_PATH}:/var/log/node
  #   restart: unless-stopped