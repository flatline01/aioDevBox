[supervisord]
nodaemon=true
user=root
logfile=/var/log/devstack/supervisord.log
pidfile=/var/run/supervisord.pid

; ----------------------------------------------------------------
; Xvnc — the VNC server (foreground mode so supervisor can track it)
; Resolution/depth/password come from environment variables set by
; entrypoint.sh before supervisord starts.
; ----------------------------------------------------------------
[program:xvnc]
command=/usr/bin/tigervncserver -fg :1
    -geometry %(ENV_VNC_RESOLUTION)s
    -depth %(ENV_VNC_COL_DEPTH)s
    -rfbport 5901
    -localhost no
user=%(ENV_DESKTOP_USER)s
environment=HOME="/home/%(ENV_DESKTOP_USER)s",USER="%(ENV_DESKTOP_USER)s",DISPLAY=":1"
autorestart=true
stdout_logfile=/var/log/devstack/xvnc.log
stderr_logfile=/var/log/devstack/xvnc_error.log

; ----------------------------------------------------------------
; noVNC — websockify bridge so the desktop is reachable from a
; plain browser at http://<host>:6901/vnc.html
; ----------------------------------------------------------------
[program:novnc]
command=websockify --web=/usr/share/novnc/ 6901 localhost:5901
autorestart=true
stdout_logfile=/var/log/devstack/novnc.log
stderr_logfile=/var/log/devstack/novnc_error.log

; ----------------------------------------------------------------
; php-fpm — foreground mode (-F) so supervisor can track it.
; Listens on 0.0.0.0:9000 (see the Dockerfile's pool.d/www.conf sed),
; reachable from the nginx container at linux:9000 over the network.
; ----------------------------------------------------------------
[program:php-fpm]
command=/bin/sh -c "mkdir -p /run/php && exec /usr/sbin/php-fpm8.1 -F"
autorestart=true
stdout_logfile=/var/log/devstack/php-fpm.log
stderr_logfile=/var/log/devstack/php-fpm_error.log