[supervisord]
nodaemon=true
user=root
logfile=/var/log/devstack/supervisord.log
pidfile=/var/run/supervisord.pid

; Lets `docker compose exec linux supervisorctl status` (and similar)
; work for debugging — without this, supervisorctl has nothing to
; connect to.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ----------------------------------------------------------------
; System D-Bus bus — there's no systemd in this container, so nothing
; else starts this. Without it, xfce4-session's proxy calls to
; system-level services (power management, session tracking, polkit)
; come back null instead of a clean "unavailable" error, which is
; what pushes it into (and then breaks) the XFCE failsafe fallback.
; Starts first (priority=1) so its socket exists before Xvnc/XFCE do.
; ----------------------------------------------------------------
[program:dbus-system]
command=/bin/sh -c "mkdir -p /run/dbus && rm -f /run/dbus/pid && exec /usr/bin/dbus-daemon --system --nofork --nopidfile"
priority=1
autorestart=true
stdout_logfile=/var/log/devstack/dbus-system.log
stderr_logfile=/var/log/devstack/dbus-system_error.log

; ----------------------------------------------------------------
; Xvnc — the VNC server (foreground mode so supervisor can track it)
; Resolution/depth/password come from environment variables set by
; entrypoint.sh before supervisord starts.
; ----------------------------------------------------------------
[program:xvnc]
command=/bin/sh -c "sleep 2 && exec /usr/bin/tigervncserver -fg :1 -geometry %(ENV_VNC_RESOLUTION)s -depth %(ENV_VNC_COL_DEPTH)s -rfbport 5901 -localhost no"
user=%(ENV_DESKTOP_USER)s
environment=HOME="/home/%(ENV_DESKTOP_USER)s",USER="%(ENV_DESKTOP_USER)s",DISPLAY=":1"
priority=10
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/var/log/devstack/xvnc.log
stderr_logfile=/var/log/devstack/xvnc_error.log

; ----------------------------------------------------------------
; noVNC — websockify bridge so the desktop is reachable from a
; plain browser at http://<host>:6901/vnc.html
; ----------------------------------------------------------------
[program:novnc]
command=websockify --web=/usr/share/novnc/ 6901 localhost:5901
autorestart=true
stdout_logfile=/var/log/devstack/novnc.log
stderr_logfile=/var/log/devstack/novnc_error.log

; ----------------------------------------------------------------
; php-fpm — foreground mode (-F) so supervisor can track it.
; Listens on 0.0.0.0:9000 (see the Dockerfile's pool.d/www.conf sed),
; reachable from the nginx container at linux:9000 over the network.
; ----------------------------------------------------------------
[program:php-fpm]
command=/bin/sh -c "mkdir -p /run/php && exec /usr/sbin/php-fpm8.1 -F"
autorestart=true
stdout_logfile=/var/log/devstack/php-fpm.log
stderr_logfile=/var/log/devstack/php-fpm_error.log

; ----------------------------------------------------------------
; dns-sync — makes every *.local hostname resolve to the nginx
; container (runs dnsmasq; see linux/dns-sync.sh). Depends on the
; "nginx" hostname being resolvable, so it waits/retries internally —
; no explicit startretries tuning needed here.
; ----------------------------------------------------------------
[program:dns-sync]
command=/opt/dns-sync.sh
autorestart=true
stdout_logfile=/var/log/devstack/dns-sync.log
stderr_logfile=/var/log/devstack/dns-sync_error.log