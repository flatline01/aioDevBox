# nginx/conf.d/default.conf
#
# Catch-all for any request whose Host header doesn't match one of the
# vhosts generated from sites.json (see docker-entrypoint.d/50-provision-sites.sh).
# Closes the connection rather than falling back to serving anything.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

